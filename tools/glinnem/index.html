<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Glinnem - Druidcdp.net</title>

  <link rel="icon" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      background: #111;
      color: white;
      font-family: Roboto;
      text-align: center;
      padding-top: 40px;
    }

    img {
      width: 25%;
      height: auto;
      margin-bottom: 20px;
    }

    a {
      color: #EDAD0B;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    input {
      width: 60%;
      padding: 10px;
      background: #2a2a2a;
      border: 2px solid #EDAD0B;
      color: white;
      font-family: Roboto;
    }

    .dropdown {
      width: 60%;
      margin: auto;
      background: #1e1e1e;
      border: 2px solid #EDAD0B;
      text-align: left;
      display: none;
      position: relative;
    }

    .item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }

    .item:hover {
      background: #2a2a2a;
    }

    .small {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <img src="/glipost.png">

  <h>CURRENT VERSION: 1.0<br><br>About:</h>
  <p>Glinnem is a free heavy-weight software designed for building and running video games.<br>As of version 1.0, it currently supports 2D and 3D games, and is written entirely in C++ 17.</p>

</body>

</html>
